<body>
    <!-- Floating Particles Background -->
    <div id="particles-container" class="particles-container"></div>

    <!-- Loading Spinner -->
    <div class="loader-wrapper" id="loader">
        <div class="loader"></div>
        <span class="loader-text">Loading...</span>
    </div>

    <!-- Navigation -->
    <header>
        <nav class="glass-effect">
            <ul>
                <li><a href="#hero">Home</a></li>
                <li><a href="#github-stats">GitHub</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title fade-in">Hi, I'm Berkay</h1>
                <p class="hero-subtitle fade-in">Vibe Coder</p>
            </div>
            <div class="hero-image fade-in">
                <img src="images/profile.jpg" alt="Berkay" class="profile-photo" loading="lazy">
            </div>
        </div>
    </section>

    <!-- GitHub Stats Section -->
    <section id="github-stats">
        <div class="container">
            <h2 class="section-title fade-in">GitHub Stats</h2>
            <div class="stats-grid fade-in">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-code-branch"></i></div>
                    <div class="stat-number" data-target="0" id="repo-count">0</div>
                    <div class="stat-label">Repositories</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-star"></i></div>
                    <div class="stat-number" data-target="0" id="star-count">0</div>
                    <div class="stat-label">Stars Earned</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-number" data-target="0" id="follower-count">0</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-user-plus"></i></div>
                    <div class="stat-number" data-target="0" id="following-count">0</div>
                    <div class="stat-label">Following</div>
                </div>
            </div>

            <!-- GitHub Repos -->
            <h3 class="subsection-title fade-in">Featured Repositories</h3>
            <div id="github-repos" class="repos-grid fade-in">
                <!-- Repos will be loaded via JavaScript -->
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects">
        <div class="container">
            <h2 class="section-title fade-in">Projects</h2>
            <div id="product-list" class="projeler-grid">
                <!-- Project cards loaded via JavaScript -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <footer id="contact">
        <div class="container">
            <h2 class="section-title fade-in">Contact</h2>
            <form class="contact-form fade-in" action="/api/emails" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <p class="copyright">© 2025 Berkay. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
